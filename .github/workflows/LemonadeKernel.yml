name: A50 + KernelSU v0.9.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            device-tree-compiler zip git python3 lz4 cpio \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Toolchain (Proton Clang)
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Baixar KernelSU v0.9.5
        run: |
          git clone https://github.com/tiann/KernelSU KernelSU
          git -C KernelSU checkout v0.9.5

      - name: Compilar
        run: |
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=arm64 a50-lemonade_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Empacotar (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image ak3/Image
          sed -i -E 's/do.devicecheck=1/do.devicecheck=0/' ak3/anykernel.sh
          sed -i -E 's#^(block|BLOCK)=.*#\1=auto;#' ak3/anykernel.sh
          cd ak3 && zip -r9 ../A50-KSU.zip . -x ".git*" "README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: A50-KSU
          path: A50-KSU.zip
          if-no-files-found: error
